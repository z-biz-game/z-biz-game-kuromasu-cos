name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: syntax + engine guarantees
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # No npm install: the game has zero runtime dependencies, and pulling Electron into
      # CI to prove nothing is how a repo starts failing on a network flake.
      - name: Syntax check every source
        run: |
          for f in $(git ls-files 'js/*.js' 'js/*/*.js'); do node --check "$f" || exit 1; done
          node --check server.cjs
          node --check electron/main.cjs
          node --check electron/preload.cjs
          for f in $(git ls-files 'tools/*.mjs' tools/scenarios.js); do node --check "$f" || exit 1; done

      # The real gate: every generated board must have one solution and be reachable by
      # pencil logic. This is a plain Node test, so it guards merges without a browser.
      - name: Engine tests
        run: node tools/engine-test.mjs

      # The ladder is a promise, not a caption: `TIERS[].band` is a selection target, and this
      # step goes red if a tier stops landing in its own band or the medians stop ordering.
      # 文档也是被断言的面：README / DESIGN 印出去的档位表、规则条数、端口、SAMPLES、行号引用，
      # 每一条都要等于代码的现在值。它不碰浏览器，在 check job 里就能红。
      - name: Docs equal the current values in code
        run: node tools/doctest.mjs

      # 破坏台账：一把从没红过的闸和一把没接线的闸输出是一模一样的。这里把每一类谎各写回临时副本
      # 一遍（真文件不动），要求 doctest 必须**点名**红；任何一把刀没红就整体红在这里。
      # 本地入口是同一个脚本（npm run sabotage），tools/verify.sh 的 logic 档也跑它——没有只给 CI 的门。
      - name: Sabotage ledger proves the docs gate can go red
        run: node tools/sabotage.mjs

      - name: Difficulty ladder is still measured
        run: node tools/balance.mjs
        env:
          SAMPLES: "24"

      - name: Entry files exist
        run: test -f index.html && grep -q '<canvas' index.html && grep -q 'js/main.js' index.html
      # 部署集闸：按 tools/assemble-site.sh 那份清单真拷一遍产物，要求页面会去要的东西
      # 都在里面。这一仓曾经因为清单落后于页面而线上 404 自己的 manifest/sw.js/图标，
      # 而本地一切全绿——因为本地根本没有「按清单拷」这一步。
      - name: Deploy set gate
        run: node tools/deploy-set.mjs
      # 阴性自证：每一类断言当场被打红一次，闸必须点名吃掉那一刀；写在注释里的假路径
      # 必须不算引用。钉住的条数由这一跑证明它真的会红，不是由记性证明。
      - name: Deploy set gate proves it can fail
        run: node tools/deploy-set-selftest.mjs

  # 真浏览器闸：headless Chrome + CDP，读 DOM 文本/几何与画布像素，不读内部标志位。
  # 独立 job，node 22 而不是 check job 的 20：台架是裸 CDP 驱动，用的是 Node 22 才有的全局
  # WebSocket/fetch；在 20 上第一次 attach 就死在 "WebSocket is not defined"，一条断言都跑不到。
  browser:
    name: real browser gate (both URL shapes)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # 410 项浏览器断言（10 个场景 engine gen play ink hint stroke conflict save resume layout）在两种 URL 形态下的条数逐条相同，是 2026-09-28 在本机实跑出来的，
      # 不是引用。在这一步之前 CI 一步都没跑过 tools/verify.sh：闸是写了给人看的，不是给人跑的。
      - name: Browser gate, root shape
        env:
          WD_TIMEOUT: 900
        run: bash tools/verify.sh

      # Pages 把这个仓发在 /z-biz-game-kuromasu-cos/ 之下，而根形态的服务方式分辨不出斜杠开头的 import——
      # 同组织已经因此红过一次（部署站上 404，本地闸全绿）。所以前缀形态也是闸的一部分。
      - name: Browser gate, prefix shape (how Pages serves us)
        env:
          WD_TIMEOUT: 900
        run: |
          root=$(mktemp -d)
          ln -s "$GITHUB_WORKSPACE" "$root/z-biz-game-kuromasu-cos"
          python3 -m http.server 5506 --bind 127.0.0.1 --directory "$root" &
          SERVER=$!
          trap 'kill $SERVER 2>/dev/null' EXIT
          for i in $(seq 1 40); do
            curl -fsS -m 2 "http://127.0.0.1:5506/z-biz-game-kuromasu-cos/" >/dev/null 2>&1 && break
            sleep 0.25
          done
          curl -fsS -m 3 "http://127.0.0.1:5506/z-biz-game-kuromasu-cos/js/main.js" >/dev/null
          curl -fsS -m 3 "http://127.0.0.1:5506/z-biz-game-kuromasu-cos/js/engine/count.js" >/dev/null
          BASE_URL=http://127.0.0.1:5506/z-biz-game-kuromasu-cos/ bash tools/verify.sh
