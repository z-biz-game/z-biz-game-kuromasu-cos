name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # No bundler: the game ships plain ES modules, so the site is a file copy.
      # Only the paths reachable from index.html go into the artifact — keeping the server,
      # the electron shell, the harness and the docs out also keeps node_modules out, which
      # `path: .` would happily upload. icons/ + assets/ + manifest + sw.js 是 2026-10-02 起
      # 真的被 index.html 引用了（真 PNG 图标、可平铺纸纹、离线缓存），漏一个就是 404。
      - name: Assemble static site
        run: |
          mkdir _site
          cp index.html manifest.webmanifest sw.js _site/
          cp -r css js icons assets _site/
      - name: Every path the page and the manifest reference is in the artifact
        run: |
          test -f _site/manifest.webmanifest
          test -f _site/sw.js
          test -f _site/icons/icon-192.png
          test -f _site/icons/icon-512.png
          test -f _site/icons/apple-touch-icon.png
          test -f _site/assets/textures/paper-grain.png
          for f in $(git ls-files 'assets/ui/*.png' 'assets/sprites/*.png'); do test -f "_site/$f" || exit 1; done
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
